# s1 = backend-s1 (NestJS + Chromium para reportes PDF). Puerto interno 3000;
# se publica solo en 127.0.0.1:${S1_PORT}.
services:
  s1:
    # REGISTRY vacío = imagen local (backend-s1:<tag>); con valor se antepone (<registry>/backend-s1:<tag>).
    image: ${REGISTRY:+${REGISTRY}/}${S1_IMAGE:-backend-s1}:${S1_TAG:?define S1_TAG en .env.instance}
    # ./deltactl fija PULL_POLICY=never cuando REGISTRY está vacío (ver compose-s0.yaml).
    pull_policy: ${PULL_POLICY:-missing}
    container_name: s1_${INSTANCE}
    restart: unless-stopped
    # El servicio solo corre en las instancias que lo listan en COMPOSE_PROFILES (.env.instance).
    profiles: ["s1"]
    # s0 llama a s1 por TCP (5020) y s1 llama a s0 por HTTP (3200): si s0 está activo en la
    # instancia, se arranca primero. required: false permite instancias sin s0 (con un Auth
    # que corra en otro lugar); sin esa opción Compose rechazaría el proyecto.
    depends_on:
      s0:
        condition: service_healthy
        required: false
    env_file:
      - ./instances/${INSTANCE}/.env.s1
    environment:
      # Fijo: debe coincidir con el puerto interno publicado abajo. Pisa lo que diga .env.s1.
      SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:${S1_PORT:?define S1_PORT en .env.instance}:3000"
    volumes:
      - ${DATA_DIR:-./instances/${INSTANCE}/data}/s1/media:/app/src/media
      - ${DATA_DIR:-./instances/${INSTANCE}/data}/s1/uploads:/app/uploads
      - ${DATA_DIR:-./instances/${INSTANCE}/data}/s1/fileIncidentsResolved:/app/fileIncidentsResolved
      - ${DATA_DIR:-./instances/${INSTANCE}/data}/s1/imageIncidentsResolved:/app/imageIncidentsResolved
      # JSON de cuentas de servicio de Firebase (FCM_CERT / KEEPER_FCM_CERT), solo lectura.
      - ./instances/${INSTANCE}/secrets:/run/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cada instancia puede abrir hasta 2 Chromium a la vez: ajusta según la carga real.
    mem_limit: ${S1_MEM_LIMIT:-400m}
    # Techo de CPU en núcleos (ver compose-s0.yaml). Chromium genera PDF a ráfagas: con menos CPU tarda más, no falla.
    cpus: ${S1_CPUS:-0.7}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
