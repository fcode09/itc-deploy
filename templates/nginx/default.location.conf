    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the protocol the person used: what the server in front says when it ends HTTPS, else this one
        set $deltactl_proto $scheme;
        if ($http_x_forwarded_proto != "") { set $deltactl_proto $http_x_forwarded_proto; }
        proxy_set_header X-Forwarded-Proto $deltactl_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
